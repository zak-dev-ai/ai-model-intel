<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | AI Model Ranks</title>
<style>
  :root { --bg:#09090b; --surface:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa; --cyan:#06b6d4; --green:#10b981; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:2rem; max-width:1000px; margin:0 auto; }
  h1 { margin-bottom:2rem; display:flex; align-items:center; gap:1rem; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.5rem; margin-bottom:1.5rem; }
  h2 { font-size:1.25rem; margin-bottom:1rem; color:var(--cyan); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:0.75rem; color:var(--muted); font-size:0.875rem; border-bottom:1px solid var(--border); }
  td { padding:0.75rem; border-bottom:1px solid var(--border); }
  input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:0.5rem; border-radius:6px; font-family:monospace; }
  button { background:var(--cyan); color:#000; border:none; padding:0.75rem 1.5rem; border-radius:8px; font-weight:600; cursor:pointer; font-size:1rem; }
  button:hover { opacity:0.9; }
  .btn-secondary { background:var(--surface); border:1px solid var(--border); color:var(--text); margin-left:1rem; }
  #toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:var(--green); color:#000; padding:1rem 2rem; border-radius:8px; font-weight:600; display:none; z-index:100; }
</style>
</head>
<body>

<h1>🐙 AI Model Ranks <span style="font-size:1rem; color:var(--muted); font-weight:400;">Admin Console</span></h1>

<div class="card">
  <h2>🔗 Referral Routing Engine</h2>
  <p style="color:var(--muted); margin-bottom:1rem;">Update provider URLs. Changes apply to the global routing engine.</p>
  <table id="ref-table">
    <thead><tr><th>Provider</th><th>Destination URL</th></tr></thead>
    <tbody></tbody>
  </table>
  <div style="margin-top:1.5rem; display:flex; align-items:center;">
    <button onclick="exportConfig()">Export to config.js</button>
    <button class="btn-secondary" onclick="window.location.href='/'">View Live Site</button>
  </div>
</div>

<div id="toast">✅ Config copied to clipboard! Paste into config.js.</div>

<script src="/config.js"></script>
<script>
  const tbody = document.querySelector('#ref-table tbody');
  const config = window.ConfigManager ? ConfigManager.get() : { referrals: {} };

  function renderTable() {
    tbody.innerHTML = Object.entries(config.referrals).map(([key, url]) => `
      <tr>
        <td style="font-weight:600; text-transform:capitalize;">${key}</td>
        <td><input type="text" value="${url}" data-key="${key}" onchange="updateRef(this)"></td>
      </tr>
    `).join('');
  }

  function updateRef(input) {
    config.referrals[input.dataset.key] = input.value;
  }

  function exportConfig() {
    const code = `/**\n * AI Model Ranks — Global Configuration\n * Generated: ${new Date().toISOString()}\n */\n\nconst DEFAULT_CONFIG = ${JSON.stringify(config, null, 2)};\n\nwindow.ConfigManager = {\n  get: () => DEFAULT_CONFIG,\n  getReferral: (provider) => {\n    const key = (provider || '').toLowerCase().trim();\n    return DEFAULT_CONFIG.referrals[key] || DEFAULT_CONFIG.referrals['openrouter'] || '#';\n  },\n  getRapidApiUrl: () => DEFAULT_CONFIG.site.rapidapi\n};`;
    
    navigator.clipboard.writeText(code).then(() => {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    });
  }

  renderTable();
</script>
</body>
</html>
