name: Daily Blog Post Generator
on:
  schedule:
    # Run daily at 06:00 UTC (14:00 MYT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger blog article generation
        run: |
          curl -s -X POST "https://www.aimodelranks.live/api/blog/generate" \
            -H "Origin: https://github.com" \
            -w "\nHTTP %{http_code}" || echo "Generation failed"
